name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx vsce package --out opencode-v2-vscode.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-v2-vscode
          path: opencode-v2-vscode.vsix
